groups:
  - name: voice-agent-availability
    rules:
      # The ONLY Prometheus scrape target in this stack is the OTel collector's
      # Prometheus exporter (prometheus.yml -> otel-collector:8889). Every metric
      # rule below binds to a series the backend ACTUALLY emits (verified against
      # source: http_requests_* / http_request_duration_ms from main.py,
      # voice_calls_* from celery_worker.py + agent.py). Rules never reference
      # series that do not exist, so a silent cluster stays silent instead of
      # inventing alerts.

      # 1. Canary: has the fleet emitted ANY signal at all?
      #    - If the collector hasn't scraped a health-check target, or
      #    - if Prometheus can't see the single scrape target
      #    ...the whole stack may be down with no metric or log signal. This is the one
      #    alert you want even when everything else went silent.
      - alert: VoiceStackSilent
        expr: |
          up{job="otel-collector"} == 0
          or on() (sum(up) == 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No telemetry signal from the stack"
          description: "The OTel collector / Prometheus scrape is not reporting, or the fleet is completely silent. Check the last persisted call record and Loki logs."

      # 2. Collector is down — metrics and structured logs cannot be exported.
      - alert: OTelCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "otel-collector is not running"
          description: "The OpenTelemetry Collector is down. Metrics and structured logs cannot be exported; inspect the persisted call record and service output."

      # 3. API 5xx rate above 5% (series: http_requests_5xx_total / http_requests_total — real)
      - alert: BackendHigh5xxRate
        expr: |
          sum(rate(http_requests_5xx_total[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1)
          > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API 5xx rate above 5%"
          description: "{{ $value | humanizePercentage }} of HTTP requests returned 5xx in the last 5 min. Inspect correlated Loki logs using the request ID."

      # 4. API p95 latency above 3s (real histogram: http_request_duration_ms)
      - alert: HttpLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le))
            > 3000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 3s"
          description: "p95 HTTP latency is {{ $value | humanizeDuration }}ms, above the 3s budget."

      # 5. Voice-call error rate above 10% (real: voice_calls_error_total / voice_calls_started_total)
      - alert: VoiceCallErrorRateHigh
        expr: |
          sum(rate(voice_calls_error_total[5m]))
            / clamp_min(sum(rate(voice_calls_started_total[5m])), 1)
          > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Voice call error rate above 10%"
          description: "{{ $value | humanizePercentage }} of outbound calls errored in the last 5 min. Inspect the persisted call record and correlated Loki logs."

      # 6. Pending (backlog) calls stuck — the dispatcher's real gauge (voice_calls_pending_total).
      #    A backlog here == calls not being claimed because the worker crashed.
      - alert: VoiceCallsBacklogHigh
        expr: voice_calls_pending_total > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbound call backlog above 20"
          description: "{{ $value }} calls are stuck pending — the celery worker likely crashed. Inspect Celery worker logs and the persisted call records."

      # 7. Calls stuck mid-dial. A row in "calling" whose worker died is invisible
      #    to every other signal: it is not pending, so the backlog gauge is blind
      #    to it, and no task is running, so no error counter moves. These gauges
      #    come from the dispatcher querying status="calling" each beat.
      #    Age is created_at-based, so it is an UPPER BOUND on calling age.
      #    Do NOT auto-recover these: resetting to "pending" re-dials a number that
      #    may already have connected and transferred.
      - alert: VoiceCallsStuckInFlight
        expr: voice_calls_inflight_oldest_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Outbound call stuck mid-dial"
          description: "{{ $value }}s — a call has been in state 'calling' far longer than any real call, so the worker died mid-dial. {{ $labels.instance }} also has voice_calls_inflight_total in flight. Inspect the persisted record and LiveKit/SIP logs, then resolve the row BY HAND. Do not reset it to pending: the number may already have been dialled."

      # 8. Calls are in flight but the dispatcher stopped reporting. Catches a
      #    dead dispatcher, which would otherwise let both gauges go stale-flat and
      #    make "no stuck calls" indistinguishable from "nobody is looking".
      - alert: VoiceCallsInFlightNotObserved
        expr: |
          voice_calls_inflight_total > 0
          unless on() (voice_calls_inflight_total offset 15m)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "In-flight gauge is stale"
          description: "voice_calls_inflight_total was non-zero but has not been reported for 15m, so the dispatcher or its beat schedule has stopped. The 'no stuck calls' state is untrustworthy until it reports again."
