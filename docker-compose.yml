
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    ports:
      - "8001:8000"
    environment:
      - TZ=Asia/Kolkata
    restart: unless-stopped

  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    environment:
      - TZ=Asia/Kolkata
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - TZ=Asia/Kolkata
    restart: unless-stopped
