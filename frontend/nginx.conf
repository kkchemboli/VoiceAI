# Port map, and why it looks unusual:
#
#   host 443 -> container 8443   the real frontend, TLS
#   host  80 -> container 8081   redirect to https
#   (unpublished) container 8080 healthcheck only
#
# The container runs as USER nginx with cap_drop: ALL, which is what keeps the
# earlier crash-loop fixed. Binding 80 or 443 needs CAP_NET_BIND_SERVICE, and
# that capability is deliberately dropped, so nginx cannot listen on them
# directly. Publishing host 443 onto container 8443 sidesteps the problem
# without giving the capability back. TLS is unaffected: certificates are issued
# for a hostname, not a port.
#
# The 8080 listener exists only for the container healthcheck. It answers /health
# and 404s everything else, so it cannot become a second way around the login
# gate for anything else on the container network.

server {
    listen 8080;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location / {
        return 404;
    }
}

# Everything arriving on plain http is bounced to https, because the session
# cookie is issued with the Secure flag and a browser silently drops a Secure
# cookie sent over http -- which looks exactly like a login that never sticks.
# 308 preserves the method and body, so this is safe for non-GET traffic.
server {
    listen 8081;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Mounted read-only from TLS_CERT_DIR. The private key must be readable by
    # the container's nginx user (uid 101) or the master process aborts at
    # startup, so on the host it needs to be group/world readable or owned by
    # uid 101 -- the usual 0600-root-only default will not work here.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    # Session tickets off: ticket keys would let an old session be replayed
    # after a restart for as long as the key lives.
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The whole basis of the login gate. The API challenges any request
        # carrying this header and trusts any request without it, so it is set
        # on everything proxied here and nowhere else. The external server talks
        # to the published 8000 port directly and never gets this header, which
        # is what keeps it on the trusted server-to-server path.
        proxy_set_header X-Frontend-Proxy 1;

        # Long enough for an SSE/stream to finish rather than being cut at the
        # default 60s.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
