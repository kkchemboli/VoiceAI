receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 1536
    spike_limit_mib: 256
  resourcedetection:
    detectors: [env, system]
    timeout: 10s
  batch:
    send_batch_size: 1024
    timeout: 5s
  # Keep voice-call traces near real time once a call ends.
  batch/traces:
    send_batch_size: 128
    timeout: 1s
  batch/logs:
    send_batch_size: 512
    timeout: 3s

exporters:
  # Loki's own "loki" exporter was removed from opentelemetry-collector-contrib,
  # so referencing it made the collector refuse to start (and took the entire
  # trace/metric/log pipeline with it). Loki 3.x ingests OTLP natively, so send
  # logs to its OTLP endpoint instead; the otlphttp exporter appends /v1/logs.
  # Loki promotes service.name / service.namespace / service.instance.id to
  # labels by default, which is what the old default_labels_enabled was reaching
  # for. The previous tenant.context_key (com.splunk.sourcetype) was a Splunk
  # artifact and is dropped: this Loki runs with auth_enabled: false, so tenancy
  # does not apply.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_BASE_URL}/api/public/otel
    auth:
      authenticator: basicauth/langfuse
    headers:
      x-langfuse-ingestion-version: "4"

extensions:
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1888
  zpages:
    endpoint: 0.0.0.0:55679

service:
  # basicauth/langfuse must be listed here. The otlphttp/langfuse exporter
  # references it as an authenticator, and an extension that is declared but not
  # listed under service.extensions is never instantiated -- so the collector
  # failed to start with 'authenticator basicauth/langfuse not found'.
  extensions: [basicauth/langfuse, health_check, pprof, zpages]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch/logs]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch/traces]
      exporters: [otlphttp/langfuse]
