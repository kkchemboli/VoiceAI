services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The redis entrypoint starts as root and drops to the redis user via
    # setpriv before exec'ing the server. Without SETUID/SETGID that drop fails
    # with "setresuid failed: Operation not permitted" and the container exits
    # 127, so cap_drop: ALL on its own makes redis unstartable. no-new-privileges
    # still prevents the server from regaining privilege once it has dropped.
    cap_add:
      - SETUID
      - SETGID
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis-data:

networks:
  backend:
    driver: bridge
